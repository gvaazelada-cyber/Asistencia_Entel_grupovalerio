<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Valerio - Entel Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8fafc;--white:#fff;--border:#e2e8f0;
  --text:#0f172a;--sub:#64748b;
  --accent:#2563eb;--green:#10b981;--amber:#f59e0b;--red:#ef4444;
  --sh:0 4px 6px -1px rgba(0,0,0,0.1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}

/* UI MEJORADA */
.header{background:var(--accent);color:#fff;padding:25px 20px;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
.status-card{background:#fff;margin:-30px 20px 20px;padding:20px;border-radius:18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase}
.badge-active{background:#ecfdf5;color:var(--green)}
.badge-pause{background:#fffbeb;color:var(--amber)}

/* CALENDARIO */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:15px}
.day-box{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#f1f5f9;color:var(--sub)}
.day-ontime{background:var(--green);color:#fff}
.day-late{background:var(--amber);color:#fff}

/* CONTROLES */
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
.main-btn{border:none;padding:20px;border-radius:16px;font-weight:800;color:#fff;cursor:pointer;transition:transform 0.2s}
.main-btn:active{transform:scale(0.95)}
.timer-text{font-family:'JetBrains Mono';font-size:24px;font-weight:700;color:var(--accent);text-align:center}

#login-screen{position:fixed;inset:0;background:var(--accent);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}
</style>
</head>
<body>

<div id="login-screen">
  <div style="background:#fff;padding:30px;border-radius:24px;width:100%;max-width:360px">
    <h2 style="margin-bottom:8px">Grupo Valerio</h2>
    <p style="color:var(--sub);font-size:14px;margin-bottom:20px">Acceso Asesores Entel</p>
    <input type="email" id="li-em" placeholder="Correo" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--border);border-radius:10px">
    <input type="password" id="li-pw" placeholder="Contraseña" style="width:100%;padding:12px;margin-bottom:20px;border:1px solid var(--border);border-radius:10px">
    <button onclick="doLogin()" style="width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:700">Entrar →</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <p style="opacity:0.8;font-size:12px">Bienvenido</p>
        <h2 id="user-nm">James</h2>
      </div>
      <div id="clock" style="font-family:'JetBrains Mono';font-weight:700">00:00:00</div>
    </div>
  </div>

  <div class="status-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span id="state-badge" class="badge badge-pause">Fuera de Turno</span>
      <span id="store-nm" style="font-size:11px;font-weight:700;color:var(--accent)">Buscando tienda...</span>
    </div>
    <div id="timer-container" style="display:none">
      <p style="font-size:11px;text-align:center;color:var(--sub)">TIEMPO EN REFRIGERIO</p>
      <div class="timer-text" id="refri-timer">00:00</div>
    </div>
  </div>

  <div style="padding:0 20px">
    <h3>Mi Asistencia</h3>
    <div class="calendar-grid" id="calendar"></div>
  </div>

  <div class="btn-grid">
    <button class="main-btn" style="background:var(--green)" onclick="handleMark('Entrada')">ENTRADA</button>
    <button class="main-btn" style="background:var(--red)" onclick="handleMark('Salida')">SALIDA</button>
    <button class="main-btn" style="background:var(--amber)" onclick="handleMark('Almuerzo')">ALMUERZO</button>
    <button class="main-btn" style="background:var(--accent)" onclick="handleMark('Regreso')">REGRESO</button>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwIWbklu_gTm6yO60fRGRwYzjDexurw_aRVer4ly_fjngCkddXYoXAVe81TU9Lv9aI/exec';

const TIENDAS = [
  { id: "GV-TEHUAMANTANGA", lat: -11.8335, lng: -77.0351, abre: "09:00" },
  { id: "GV-TECARABAYLLO", lat: -11.8954, lng: -77.0371, abre: "09:00" },
  { id: "GV-TECOLLIQUE", lat: -11.9288, lng: -77.0354, abre: "08:30" },
  { id: "GV-TELOSPINOS", lat: -11.9614, lng: -77.0654, abre: "09:00" },
  { id: "GV-TEJRDELAUNION", lat: -12.0468, lng: -77.0315, abre: "10:00" },
  { id: "GV-TEATE", lat: -12.0234, lng: -76.9245, abre: "09:00" },
  { id: "GV-TEHUAYCAN", lat: -12.0165, lng: -76.8322, abre: "08:30" },
  { id: "GV-TEATECA", lat: -12.0521, lng: -76.9554, abre: "09:00" },
  { id: "GV-TELURIN", lat: -12.2634, lng: -76.8715, abre: "09:00" }
];

let me = null, activeStore = null, timerInt = null;

// LÓGICA DE TIEMPO
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  detectStore();
}, 1000);

async function detectStore() {
  navigator.geolocation.getCurrentPosition(p => {
    const found = TIENDAS.find(t => {
      const d = Math.hypot(p.coords.latitude - t.lat, p.coords.longitude - t.lng) * 111320;
      return d <= 300; // Radio de 300m para James
    });
    if(found) {
      activeStore = found;
      document.getElementById('store-nm').textContent = "📍 " + found.id;
    } else {
      document.getElementById('store-nm').textContent = "⚠️ Fuera de Rango";
    }
  });
}

async function doLogin() {
  const em = document.getElementById('li-em').value, pw = document.getElementById('li-pw').value;
  const r = await fetch(`${API_URL}?action=login&email=${em}&pass=${pw}`).then(res => res.json());
  if(r.ok) {
    me = r.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-nm').textContent = me.nombre;
    renderCalendar();
  }
}

function handleMark(tipo) {
  if(!activeStore) return alert("Debes estar en una tienda autorizada.");
  
  const ahora = new Date();
  const [hAbre, mAbre] = activeStore.abre.split(':').map(Number);
  const limite = new Date(); limite.setHours(hAbre, mAbre + 10, 0); // 10 min tolerancia

  if(tipo === 'Entrada') {
    const puntual = ahora <= limite;
    updateStatus('En Turno', puntual ? 'green' : 'amber');
  }

  if(tipo === 'Almuerzo') startTimer();
  if(tipo === 'Regreso') stopTimer();

  saveToSheets(tipo);
}

function startTimer() {
  document.getElementById('timer-container').style.display = 'block';
  updateStatus('En Refrigerio', 'amber');
  let sec = 0;
  timerInt = setInterval(() => {
    sec++;
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    document.getElementById('refri-timer').textContent = `${m}:${s}`;
    if(sec > 3600) document.getElementById('refri-timer').style.color = 'red'; // Alerta tras 1 hora
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInt);
  document.getElementById('timer-container').style.display = 'none';
  updateStatus('En Turno', 'green');
}

function updateStatus(txt, color) {
  const b = document.getElementById('state-badge');
  b.textContent = txt;
  b.className = `badge badge-${color === 'green' ? 'active' : 'pause'}`;
}

function renderCalendar() {
  const c = document.getElementById('calendar');
  for(let i=1; i<=31; i++) {
    const d = document.createElement('div');
    d.className = 'day-box';
    d.textContent = i;
    // Aquí se conectaría la lógica real de colores según el Sheets
    c.appendChild(d);
  }
}

async function saveToSheets(tipo) {
  await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'markRecord', email: me.email, asesor: me.nombre,
      tipo, tienda: activeStore.id, fecha: new Date().toLocaleDateString(),
      hora: new Date().toLocaleTimeString()
    })
  });
}
</script>
</body>
</html>
